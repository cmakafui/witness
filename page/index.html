<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Witness</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Witness</h1>
      <div id="link" class="off">Connecting</div>
      <button id="sidebar-toggle" class="button" aria-controls="sidebar" aria-expanded="true">Hide evidence</button>
    </header>
    <div id="goal-picker">
      <select id="goal" aria-label="Goal"><option value="">All questions</option></select>
      <div id="seq-bar" hidden>
        <input id="seq" type="range" min="1" max="1" value="1" aria-label="Step" />
        <span id="seq-value" class="id"></span>
      </div>
    </div>
    <main>
      <div id="graph-stage">
        <div id="hover-bar" aria-live="polite"></div>
        <div id="graph"></div>
        <div id="query-dock">
          <button id="query-toggle" type="button" aria-expanded="false" aria-controls="query">▸ Query</button>
          <section id="query" hidden>
            <div class="query-controls">
              <select id="preset" aria-label="Example queries"></select>
              <button id="run" class="button primary" type="button">Run query</button>
            </div>
            <textarea id="cypher" spellcheck="false" rows="4" aria-label="Cypher query"></textarea>
            <div id="rows"></div>
          </section>
        </div>
      </div>
      <aside id="sidebar">
        <div class="sidebar-head">
          <button id="evidence-back" type="button" aria-label="Back to previous question" hidden>← Back</button>
          <span class="sidebar-title">Evidence</span>
        </div>
        <section id="question"><p class="hint">Select a question.</p></section>
      </aside>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
