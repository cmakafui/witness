<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Witness</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Witness</h1>
      <div id="counts" aria-live="polite"></div>
      <div id="link" class="off">Connecting</div>
      <button id="sidebar-toggle" class="button" aria-controls="sidebar" aria-expanded="true">Hide evidence</button>
    </header>
    <main>
      <div id="graph-stage">
        <div id="navigation" hidden>
          <div><span id="navigation-summary"></span></div>
          <button id="overview" class="button">Show all</button>
        </div>
        <div id="graph"></div>
        <div id="tour" aria-label="Question navigation">
          <div class="tour-controls">
            <button id="tour-previous" class="button" aria-label="Previous question" disabled>Previous</button>
            <button id="tour-next" class="button" aria-label="Next question" disabled>Next</button>
          </div>
          <div class="tour-copy">
            <span id="tour-progress" role="status" aria-live="polite">No questions yet</span>
            <span id="tour-title"></span>
          </div>
          <input id="tour-seek" type="range" min="0" max="0" step="1" value="0" aria-label="Investigation timeline" disabled />
        </div>
      </div>
      <aside id="sidebar">
        <nav>
          <button id="evidence-back" aria-label="Back to previous question" hidden>← Back</button>
          <button data-tab="question" class="on">Evidence</button>
          <button data-tab="query">Query</button>
        </nav>
        <section id="question"><p class="hint">Select a question.</p></section>
        <section id="query" hidden>
          <select id="preset" aria-label="Example queries"></select>
          <textarea id="cypher" spellcheck="false" rows="6" aria-label="Cypher query"></textarea>
          <button id="run" class="button primary">Run query</button>
          <div id="rows"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
