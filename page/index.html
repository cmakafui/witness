<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Witness</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-view="trail">
    <header>
      <h1>Witness</h1>
      <button id="goal-line" type="button"></button>
      <button id="goals-button" class="button" type="button" popovertarget="goal-menu">Goals</button>
      <div id="goal-menu" popover role="menu" aria-label="Goals"></div>
      <div id="link" class="off">Connecting</div>
    </header>
    <nav id="views" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-view="trail">Trail</button>
      <button type="button" role="tab" data-view="evidence">Evidence</button>
      <button type="button" role="tab" data-view="changes">Changes</button>
    </nav>
    <main>
      <div id="graph-stage">
        <div id="search">
          <textarea id="search-input" rows="1" spellcheck="false" placeholder="/" aria-label="Search or Cypher"></textarea>
          <div id="results" hidden></div>
        </div>
        <div id="trail"></div>
        <section id="changes" aria-label="Changes">
          <h3>Changes</h3>
          <ol id="change-list"></ol>
        </section>
      </div>
      <aside id="sidebar">
        <div class="sidebar-head">
          <button id="evidence-back" type="button" aria-label="Back to previous question" hidden>← Back</button>
          <span class="sidebar-title">Evidence</span>
        </div>
        <section id="question"><p class="hint">Select a question.</p></section>
      </aside>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
