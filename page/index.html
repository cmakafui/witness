<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Witness</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Witness</h1>
      <div id="counts"></div>
      <div id="link" class="off">connecting</div>
    </header>
    <main>
      <div id="graph"></div>
      <aside>
        <nav>
          <button data-tab="question" class="on">Question</button>
          <button data-tab="query">Query</button>
        </nav>
        <section id="question"><p class="hint">Click a question in the graph.</p></section>
        <section id="query" hidden>
          <select id="preset"></select>
          <textarea id="cypher" spellcheck="false" rows="6"></textarea>
          <div class="row">
            <button id="run">Run</button>
            <span class="hint">Runs in this page, on its copy of the graph. $yes, $no, $failed, $running, $pending, $waiting, $current and $selected are set for you.</span>
          </div>
          <div id="rows"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
